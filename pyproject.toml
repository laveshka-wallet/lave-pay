[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lavepay"
dynamic = ["version"]
description = "Async client for the Lave Pay merchant API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Laveshka" }]
keywords = ["lavepay", "laveshka", "payments", "asyncio", "aiogram", "fastapi", "merchant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115,<1"]
aiogram = ["aiogram>=3.13,<4"]
aiohttp = ["aiohttp>=3.9,<4"]
qr = ["segno>=1.6,<2"]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<2",
    "fastapi>=0.115,<1",
    "aiogram>=3.13,<4",
    "aiohttp>=3.9,<4",
    "segno>=1.6,<2",
]

[project.urls]
Homepage = "https://laveshka.io"
Documentation = "https://laveshka.io/docs/lave-pay"
Repository = "https://github.com/laveshka-wallet/lave-pay"
Issues = "https://github.com/laveshka-wallet/lave-pay/issues"
Changelog = "https://github.com/laveshka-wallet/lave-pay/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "lavepay.__version__" }

[tool.setuptools.packages.find]
include = ["lavepay*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
lavepay = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
